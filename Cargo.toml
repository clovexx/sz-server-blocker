[package]
name = "stalzone-server-blocker"
version = "0.1.0"
edition = "2021"
description = "Блокировщик серверов Stalzone для Linux: TUI и CLI через nftables/iptables"
license = "MIT"
authors = ["clovexx <clovexx.github@gmail.com>"]
repository = "https://github.com/clovexx/sz-server-blocker"
homepage = "https://github.com/clovexx/sz-server-blocker"
readme = "README.md"
keywords = ["stalzone", "nftables", "iptables", "tui", "firewall"]
categories = ["command-line-utilities"]
exclude = ["/packaging", "/.github", "/.demo-config"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
libc = "0.2"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
urlencoding = "2"
